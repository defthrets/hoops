; Hoops -- shooting hoops on the Chamberlain Hills basketball court.
;
; Walk into the ring on the court and press E (D-pad right on a pad) to pick up the ball.
; Everything else is on screen.

[General]
; false switches the mod off without uninstalling it.
Enabled=true

; Posted Up has this same court built in. With both installed, Hoops stands down so there are
; not two games on one court. false runs both anyway.
StandDownForPostedUp=true

; How much goes in scripts\Hoops\Hoops.log: Error, Warn, Info or Debug.
LogLevel=Info

[Hoops]
; true draws a ring on each hoop where the ball has to come down through, to practise with.
ShowRings=false
